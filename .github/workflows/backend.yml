# Backend CI (specs/002-b01-backend-skeleton/contracts/ci-checks.md, research R8).
#
# No workflow-level `paths:` filter, as in mobile.yml: a required check whose workflow never starts
# stays "pending" and blocks merges. The `changes` job applies the path rule instead, and the jobs
# it skips count as passing. `backend` is the required status check.
name: backend

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      rehearse:
        description: "Staging deploy rehearsal (on master). Anything but none runs only deploy-staging."
        type: choice
        options: [none, migrate-fail, verify-fail]
        default: none

concurrency:
  group: backend-${{ github.ref }}
  # PR runs are superseded; a master run is never cancelled mid-way.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  DJANGO_SETTINGS_MODULE: config.settings.test
  IMAGE: ghcr.io/ahmedsaied94/wassal-backend

defaults:
  run:
    working-directory: backend

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      backend: ${{ steps.diff.outputs.backend }}
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
          REHEARSE: ${{ inputs.rehearse || 'none' }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ] && [ "$REHEARSE" != none ]; then
            # A rehearsal runs only deploy-staging.
            echo "backend=false" >> "$GITHUB_OUTPUT"
            exit 0
          elif [ "$EVENT" = "workflow_dispatch" ]; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
            exit 0
          elif [ "$EVENT" = "pull_request" ]; then
            base="$(git merge-base "origin/$BASE_REF" HEAD)"
          elif [ -n "$BEFORE" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            base="$BEFORE"
          else
            # First push of a branch, or history rewritten: check everything.
            echo "backend=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$base" HEAD \
              | grep -qE '^(backend/|contracts/|\.github/workflows/backend[^/]*\.yml$)'; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
          else
            echo "backend=false" >> "$GITHUB_OUTPUT"
          fi

  lint:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  types:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --locked
      - run: uv run mypy .

  test:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.11-trixie
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -h 127.0.0.1"
          --health-interval 5s --health-timeout 3s --health-retries 12
      valkey:
        image: valkey/valkey:8.1.10-trixie
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      TEST_CACHE_URL: redis://localhost:6379/2
      TEST_BROKER_URL: redis://localhost:6379/3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The runner's PostgreSQL client is older than the server, and pg_dump refuses that.
      - name: Install postgresql-client-17 from PGDG
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends postgresql-client-17
          echo /usr/lib/postgresql/17/bin >> "$GITHUB_PATH"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --locked
      - run: uv run pytest --cov --cov-fail-under=80

  contract:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --locked
      - name: Missing migrations
        run: uv run manage.py makemigrations --check --dry-run
      - name: The committed contract matches the code
        run: |
          uv run manage.py spectacular --file /tmp/openapi.yaml --validate --fail-on-warn
          diff -u ../contracts/openapi.yaml /tmp/openapi.yaml

  image:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    env:
      PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - if: env.PUSH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Built natively on each architecture. Only master pushes, by digest; image-manifest tags it.
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend
          file: backend/docker/Dockerfile
          platforms: linux/${{ matrix.arch }}
          build-args: RELEASE=${{ github.sha }}
          cache-from: type=gha,scope=backend-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=backend-${{ matrix.arch }}
          outputs: ${{ env.PUSH == 'true' && format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', env.IMAGE) || 'type=cacheonly' }}
      - if: env.PUSH == 'true'
        name: Record the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
      - if: env.PUSH == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Tags sha-<commit> only after every check passed: the release workflow treats the tag's
  # existence as that proof (FR-030).
  image-manifest:
    needs: [changes, lint, types, test, contract, image, smoke]
    if: >-
      needs.changes.outputs.backend == 'true'
      && github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: /tmp/digests
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: digests-*
          merge-multiple: true
          path: /tmp/digests
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag the multi-arch image sha-<commit>
        run: |
          refs=()
          for digest in *; do refs+=("$IMAGE@sha256:$digest"); done
          docker buildx imagetools create -t "$IMAGE:sha-$GITHUB_SHA" "${refs[@]}"
          docker buildx imagetools inspect "$IMAGE:sha-$GITHUB_SHA"

  smoke:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      COMPOSE: docker compose -f docker/compose.yml -f docker/compose.dev.yml
      # The production upstream ports (docker/env/prod.env), which the real Caddyfile proxies to.
      API_PORT: "8100"
      ADMIN_PORT: "8101"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Env file, with the hostnames the edge assertions use
        run: |
          sed -e 's/^API_HOST=.*/API_HOST=api.127-0-0-1.sslip.io/' \
            -e 's/^ADMIN_HOST=.*/ADMIN_HOST=admin.127-0-0-2.sslip.io/' .env.example >.env
      - name: Start the stack (every service healthy within 120 s)
        run: $COMPOSE up -d --build --wait --wait-timeout 120
      - name: Health on the API and admin ports
        run: |
          for port in "$API_PORT" "$ADMIN_PORT"; do
            for path in healthz readyz; do
              curl --fail --silent --show-error --max-time 5 "http://127.0.0.1:$port/$path"
              echo
            done
          done
      - name: Edge assertions (production Caddyfile, host networking)
        run: docker/edge/smoke.sh
      - if: failure()
        run: $COMPOSE logs --no-color
      - if: always()
        run: $COMPOSE down -v

  backend:
    needs: [changes, lint, types, test, contract, image, image-manifest, smoke]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: .
    steps:
      - name: Every needed job passed or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" = failure ] || [ "$result" = cancelled ]; then
              exit 1
            fi
          done

  # Staging deploys every master push that built an image, or a rehearsal (contracts/ci-checks.md,
  # contracts/operations.md "Deploy interface"). The host is reached only over WireGuard.
  deploy-staging:
    needs: [backend, image-manifest]
    if: >-
      always() && needs.backend.result == 'success' && github.ref == 'refs/heads/master'
      && ((github.event_name == 'push' && needs.image-manifest.result == 'success')
        || (github.event_name == 'workflow_dispatch' && inputs.rehearse != 'none'))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: staging
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    defaults:
      run:
        working-directory: .
    steps:
      - if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 50
      - id: request
        name: Choose the request
        env:
          EVENT: ${{ github.event_name }}
          REHEARSE: ${{ inputs.rehearse }}
        run: |
          if [ "$EVENT" = push ]; then
            echo "request=staging sha-$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A rehearsal uses the newest master commit that has an image.
          for commit in $(git rev-list HEAD); do
            if docker buildx imagetools inspect "$IMAGE:sha-$commit" >/dev/null 2>&1; then
              echo "request=staging sha-$commit rehearse-$REHEARSE" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "::error::none of the last 50 master commits has an image"
          exit 1
      - name: Connect over WireGuard
        env:
          WG_CONFIG: ${{ secrets.WG_CONFIG }}
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends wireguard-tools
          sudo install -m 0600 /dev/null /etc/wireguard/wg0.conf
          printf '%s\n' "$WG_CONFIG" | sudo tee /etc/wireguard/wg0.conf >/dev/null
          sudo wg-quick up wg0
      - name: Deploy
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          REQUEST: ${{ steps.request.outputs.request }}
        run: |
          install -d -m 0700 "$HOME/.ssh"
          install -m 0600 /dev/null "$HOME/.ssh/deploy_key"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/deploy_key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/deploy_known_hosts"
          # The key's forced command reads the request from SSH_ORIGINAL_COMMAND.
          ssh -i "$HOME/.ssh/deploy_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/deploy_known_hosts" -o ConnectTimeout=20 \
            -o ServerAliveInterval=30 deploy@10.66.0.1 "$REQUEST"
      - if: always()
        name: Disconnect
        run: |
          rm -f "$HOME/.ssh/deploy_key"
          if [ -f /etc/wireguard/wg0.conf ]; then sudo wg-quick down wg0 || true; fi
