# Mobile CI (specs/001-m03-app-shell/contracts/ci-checks.md).
#
# No workflow-level `paths:` filter: a required check whose workflow never
# starts stays "pending" and blocks merges. The `changes` job applies the
# path rule instead, and the jobs it skips count as passing.
name: mobile

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      update_goldens:
        description: Regenerate the golden PNGs and upload them as an artifact
        type: boolean
        default: false

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: apps/mobile

jobs:
  changes:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      mobile: ${{ steps.diff.outputs.mobile }}
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            base="$(git merge-base "origin/$BASE_REF" HEAD)"
          elif [ -n "$BEFORE" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            base="$BEFORE"
          else
            # First push of a branch, or history rewritten: check everything.
            echo "mobile=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$base" HEAD \
              | grep -qE '^(apps/mobile/|packages/|content/|\.fvmrc$|\.github/workflows/mobile\.yml$)'; then
            echo "mobile=true" >> "$GITHUB_OUTPUT"
          else
            echo "mobile=false" >> "$GITHUB_OUTPUT"
          fi

  check:
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true
          pub-cache: true
      - run: flutter pub get
      - run: dart run build_runner build -d
      - name: Format check
        run: dart format --output=none --set-exit-if-changed $(git ls-files '*.dart')
      - run: flutter analyze --fatal-infos
      - run: flutter test --coverage
      - name: Coverage gate
        run: dart run tool/check_coverage.dart --min 80
      # packages/content_models runs here, not in its own job: `check` is the
      # required check, so branch protection stays as it is
      # (specs/003-b04-content-pipeline/contracts/ci-checks.md).
      - name: content_models dependencies and build
        working-directory: packages/content_models
        run: |
          dart pub get
          dart run build_runner build -d
      - name: content_models format check
        working-directory: packages/content_models
        run: dart format --output=none --set-exit-if-changed $(git ls-files '*.dart')
      - name: content_models analyze
        working-directory: packages/content_models
        run: dart analyze --fatal-infos
      - name: content_models tests and coverage gate
        working-directory: packages/content_models
        run: |
          dart test --coverage=coverage
          dart run coverage:format_coverage --lcov --report-on=lib --in=coverage --out=coverage/lcov.info
          dart run ../../apps/mobile/tool/check_coverage.dart --min 80 --lcov coverage/lcov.info
      - name: Upload golden failures
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: golden-failures
          path: apps/mobile/test/**/failures/
          if-no-files-found: ignore

  build-android:
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true
          pub-cache: true
      - run: flutter pub get
      - run: dart run build_runner build -d
      - run: flutter build apk --flavor dev --debug
      - uses: actions/upload-artifact@v7
        with:
          name: app-dev-debug
          path: apps/mobile/build/app/outputs/flutter-apk/app-dev-debug.apk
          retention-days: 7

  update-goldens:
    if: github.event_name == 'workflow_dispatch' && inputs.update_goldens
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true
          pub-cache: true
      - run: flutter pub get
      - run: dart run build_runner build -d
      - run: flutter test --update-goldens test/goldens
      - uses: actions/upload-artifact@v7
        with:
          name: goldens
          path: apps/mobile/test/goldens/**/*.png
