# Mobile CI (specs/001-m03-app-shell/contracts/ci-checks.md).
#
# No workflow-level `paths:` filter: a required check whose workflow never
# starts stays "pending" and blocks merges. The `changes` job applies the
# path rule instead, and the jobs it skips count as passing.
name: mobile

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      update_goldens:
        description: Regenerate the golden PNGs and upload them as an artifact
        type: boolean
        default: false

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: apps/mobile

jobs:
  changes:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      mobile: ${{ steps.diff.outputs.mobile }}
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            base="$(git merge-base "origin/$BASE_REF" HEAD)"
          elif [ -n "$BEFORE" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            base="$BEFORE"
          else
            # First push of a branch, or history rewritten: check everything.
            echo "mobile=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$base" HEAD \
              | grep -qE '^(apps/mobile/|packages/|content/|fixtures/|\.fvmrc$|\.github/workflows/mobile\.yml$)'; then
            echo "mobile=true" >> "$GITHUB_OUTPUT"
          else
            echo "mobile=false" >> "$GITHUB_OUTPUT"
          fi

  # The app: format, analyze, tests and goldens, and the coverage gate.
  # M02's scripted player replays 58 fixtures through the trip screen, so
  # the job needs more than the others.
  app:
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true
          pub-cache: true
      # The app imports packages/content_models, whose generated parts are
      # gitignored (specs/006-m04-content-loader/contracts/ci-checks.md).
      - name: content_models build
        working-directory: packages/content_models
        run: |
          dart pub get
          dart run build_runner build -d
      - run: flutter pub get
      - run: dart run build_runner build -d
      - name: Format check
        run: dart format --output=none --set-exit-if-changed $(git ls-files '*.dart')
      - run: flutter analyze --fatal-infos
      # The committed stand-in sounds are exactly what the script writes
      # (specs/008-m02-trip-screen/contracts/ci-checks.md).
      - name: Stand-in sounds match their script
        run: python3 tool/sfx/generate.py && git diff --exit-code assets/audio/sfx
      # Rive's Linux library for the character's tests and goldens. `--clean`
      # is required: with a restored pub cache, setup otherwise returns early
      # without copying the library into build/ (research R2).
      - name: rive_native setup
        run: dart run rive_native:setup --verbose --clean --platform linux
      - run: flutter test --coverage
      - name: Coverage gate
        run: dart run tool/check_coverage.dart --min 80
      - name: Upload golden failures
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: golden-failures
          path: apps/mobile/test/**/failures/
          if-no-files-found: ignore

  # The pure-Dart packages, in parallel with the app: packages/content_models
  # (specs/003-b04-content-pipeline/contracts/ci-checks.md), then
  # packages/trip_engine, which needs its generated parts
  # (specs/004-m01-trip-engine/contracts/ci-checks.md). The engine's tests
  # replay every fixture in fixtures/parity/ (constitution III), and its gate
  # is 90% (constitution XIII).
  packages:
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/content_models
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true
          pub-cache: true
      - name: content_models dependencies and build
        run: |
          dart pub get
          dart run build_runner build -d
      - name: content_models format check
        run: dart format --output=none --set-exit-if-changed $(git ls-files '*.dart')
      - name: content_models analyze
        run: dart analyze --fatal-infos
      - name: content_models tests and coverage gate
        run: |
          dart test --coverage=coverage
          dart run coverage:format_coverage --lcov --report-on=lib --in=coverage --out=coverage/lcov.info
          dart run ../../apps/mobile/tool/check_coverage.dart --min 80 --lcov coverage/lcov.info
      - name: trip_engine dependencies
        working-directory: packages/trip_engine
        run: dart pub get
      - name: trip_engine format check
        working-directory: packages/trip_engine
        run: dart format --output=none --set-exit-if-changed $(git ls-files '*.dart')
      - name: trip_engine analyze
        working-directory: packages/trip_engine
        run: dart analyze --fatal-infos
      - name: trip_engine tests and coverage gate
        working-directory: packages/trip_engine
        run: |
          dart test --coverage=coverage
          dart run coverage:format_coverage --lcov --report-on=lib --in=coverage --out=coverage/lcov.info
          dart run ../../apps/mobile/tool/check_coverage.dart --min 90 --lcov coverage/lcov.info

  build-android:
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      # Caches the Gradle distribution, the Android dependencies and Gradle's
      # build cache (android/gradle.properties turns it on). Only master runs
      # write the cache; pull requests read it.
      - uses: gradle/actions/setup-gradle@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true
          pub-cache: true
      # The app imports packages/content_models, whose generated parts are
      # gitignored (specs/006-m04-content-loader/contracts/ci-checks.md).
      - name: content_models build
        working-directory: packages/content_models
        run: |
          dart pub get
          dart run build_runner build -d
      - run: flutter pub get
      - run: dart run build_runner build -d
      - run: flutter build apk --flavor dev --debug
      - uses: actions/upload-artifact@v7
        with:
          name: app-dev-debug
          path: apps/mobile/build/app/outputs/flutter-apk/app-dev-debug.apk
          retention-days: 7

  # One status for the whole workflow, as backend.yml's `backend` job: it
  # passes when every job above passed or was skipped by `changes`.
  check:
    needs: [changes, app, packages, build-android]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: .
    steps:
      - name: Every needed job passed or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" = failure ] || [ "$result" = cancelled ]; then
              exit 1
            fi
          done

  update-goldens:
    if: github.event_name == 'workflow_dispatch' && inputs.update_goldens
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true
          pub-cache: true
      # The app imports packages/content_models, whose generated parts are
      # gitignored (specs/006-m04-content-loader/contracts/ci-checks.md).
      - name: content_models build
        working-directory: packages/content_models
        run: |
          dart pub get
          dart run build_runner build -d
      - run: flutter pub get
      - run: dart run build_runner build -d
      - name: rive_native setup
        run: dart run rive_native:setup --verbose --clean --platform linux
      - run: >-
          flutter test --update-goldens test/goldens
          test/features/trip/rive_character_goldens_test.dart
      - uses: actions/upload-artifact@v7
        with:
          name: goldens
          path: |
            apps/mobile/test/goldens/**/*.png
            apps/mobile/test/features/trip/goldens/*.png
