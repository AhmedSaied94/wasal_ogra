# Secret scan (FR-027, research R12). `gitleaks` is a required status check on master.
name: secrets

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GITLEAKS: ghcr.io/gitleaks/gitleaks:v8.30.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Scan the new commits
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            range="$PR_BASE..$PR_HEAD"
          elif [ -n "$BEFORE" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            range="$BEFORE..$AFTER"
          else
            # First push of a branch, or history rewritten: everything reachable from it.
            range="$AFTER"
          fi
          docker run --rm -v "$PWD:/repo:ro" -w /repo "$GITLEAKS" git . --log-opts="$range" \
            --config .gitleaks.toml --redact --exit-code 1 --no-banner
      - name: Scan the working tree
        run: |
          docker run --rm -v "$PWD:/repo:ro" -w /repo "$GITLEAKS" dir . \
            --config .gitleaks.toml --redact --exit-code 1 --no-banner
