# Secret scan for the whole repository (FR-027, research R12). CI: .github/workflows/secrets.yml.
title = "wassal secret scan"

[extend]
useDefault = true

# Dev placeholders all start with change-me-, which the app refuses outside dev (FR-003), so no
# real secret can match. Scoped by value only: in gitleaks 8.30.1 a `paths` entry allow-lists the
# whole file even with condition = "AND", which would hide a real key added to .env.example.
[[allowlists]]
description = "change-me- placeholders"
regexes = ['''^change-me-''']

# The temporary hostnames are public sslip.io names derived from the hosts' addresses (research
# R14), never secrets. Scoped by value only, for the same reason as above.
[[allowlists]]
description = "sslip.io hostnames"
regexes = ['''^[a-z0-9.-]+\.sslip\.io$''']

# The backend tests' signing keys are base64url of readable text ("test-only-…",
# "second-test-…"), never secrets: the prefixes below are those words encoded. Scoped by value only,
# for the same reason as above.
[[allowlists]]
description = "test signing keys"
regexes = ['''^dGVzdC1vbmx5LX''', '''^c2Vjb25kLXRlc3Qt''']
