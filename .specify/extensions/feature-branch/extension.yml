schema_version: "1.0"

extension:
  id: feature-branch
  name: "Feature Branch Guard"
  version: "1.0.0"
  description: "Check out the active feature's git branch, or create it, before every Spec Kit step that works on a feature"
  author: wassal
  repository: https://github.com/AhmedSaied94/wasal_ogra
  license: MIT

requires:
  speckit_version: ">=1.2.0"
  tools:
    - name: git
      required: false

provides:
  commands:
    - name: speckit.feature-branch.ensure
      file: commands/speckit.feature-branch.ensure.md
      description: "Check out the active feature's git branch, or create it if it does not exist"

# Priority 5 runs these before the git extension's auto-commit hooks (priority 10),
# so any auto-commit lands on the feature branch. /speckit-specify is not hooked:
# the git extension's speckit.git.feature creates the branch there.
hooks:
  before_clarify:
    command: speckit.feature-branch.ensure
    optional: false
    priority: 5
    description: "Check out the feature branch before clarification"
  before_plan:
    command: speckit.feature-branch.ensure
    optional: false
    priority: 5
    description: "Check out the feature branch before planning"
  before_tasks:
    command: speckit.feature-branch.ensure
    optional: false
    priority: 5
    description: "Check out the feature branch before task generation"
  before_analyze:
    command: speckit.feature-branch.ensure
    optional: false
    priority: 5
    description: "Check out the feature branch before analysis"
  before_checklist:
    command: speckit.feature-branch.ensure
    optional: false
    priority: 5
    description: "Check out the feature branch before checklist generation"
  before_implement:
    command: speckit.feature-branch.ensure
    optional: false
    priority: 5
    description: "Check out the feature branch before implementation"
  before_converge:
    command: speckit.feature-branch.ensure
    optional: false
    priority: 5
    description: "Check out the feature branch before convergence"
  before_taskstoissues:
    command: speckit.feature-branch.ensure
    optional: false
    priority: 5
    description: "Check out the feature branch before syncing tasks to issues"

tags:
  - "git"
  - "branching"
  - "workflow"
