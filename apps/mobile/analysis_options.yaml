include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  exclude:
    - build/**
    - android/**
    - ios/**
    - lib/l10n/generated/**
    - "**/*.g.dart"

linter:
  rules:
    - prefer_const_constructors
    - prefer_const_declarations
    - prefer_final_locals
    - always_use_package_imports
    - unawaited_futures
    - avoid_print

plugins:
  riverpod_lint: ^3.1.9
