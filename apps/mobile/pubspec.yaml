name: wassal
description: "وصّل الأجرة: a Cairo microbus fare-and-change puzzle game."
publish_to: 'none'
version: 1.0.0+2

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.7"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  connectivity_plus: ^7.3.2
  content_models:
    path: ../../packages/content_models
  # Grapheme-cluster lengths in the pure name rules (specs/012-m07-onboarding,
  # research R7). The version Flutter already brings.
  characters: ^1.4.1
  crypto: ^3.0.7
  dio: ^5.11.1
  # The app database (specs/007-m05-local-economy, research R1). SQLite comes
  # from sqlite3's build hook, not from sqlite3_flutter_libs.
  drift: ^2.35.2
  # The trip scene and its characters (specs/008-m02-trip-screen, research R1,
  # R18): Flame draws, Rive animates the passengers, audioplayers' low-latency
  # pools play the effects. Rive stays on 0.14, which flame_rive requires.
  flame: ^1.38.2
  flame_audio: ^2.12.2
  flame_rive: ^1.11.2
  flutter_riverpod: ^3.4.3
  # The session tokens, and the install id on iOS (specs/011-m06-identity-sync,
  # research R1, R2). A Swift Package on iOS, so there is still no Podfile.
  flutter_secure_storage: ^11.2.0
  # The design's icons, illustrations and the passengers' static art
  # (specs/008.5-m21-design-refresh, research R17).
  flutter_svg: ^2.3.0
  go_router: ^18.1.0
  intl: ^0.20.3
  material_ui: ^1.7.0
  package_info_plus: ^10.2.2
  path_provider: ^2.1.6
  riverpod_annotation: ^4.0.7
  rive: ^0.14.11
  # The result's picture through the phone's share sheet, behind ShareGateway
  # (specs/013-m08-home-result, research R16). Its iOS plugin is a Swift
  # Package, so there is still no Podfile.
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  # Direct for its Android options: `AndroidInstallIdStore` writes the
  # install id to its own backed-up file, `wassal_install.xml`
  # (specs/011-m06-identity-sync, research R1).
  shared_preferences_android: ^2.5.1
  sqlite3: ^3.7.1
  trip_engine:
    path: ../../packages/trip_engine
  # The update card's store link (specs/011-m06-identity-sync, research R18).
  url_launcher: ^6.3.3
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: any
  # Formats the generated design tokens (tool/design/gen_tokens.dart).
  dart_style: ^3.1.14
  drift_dev: ^2.35.1
  fake_async: ^1.3.3
  flame_test: ^2.3.1
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.8
  integration_test:
    sdk: flutter
  riverpod_generator: ^4.0.9
  shared_preferences_platform_interface: ^2.4.2

flutter:
  generate: true
  uses-material-design: true

  # Tunable defaults (contracts/tunables.md). The dev overrides file is
  # bundled only in the dev variant (research R12).
  assets:
    - assets/config/tunables.json
    # The trip's character file and stand-in sound effects (specs/008-m02-
    # trip-screen, contracts/rive-character.md and research R18).
    - assets/rive/
    - assets/audio/sfx/
    # The design's icons and illustrations, synced from docs/design by
    # tool/design/sync_assets.dart (specs/008.5-m21-design-refresh, research
    # R19). Asset folders aren't recursive, so each is listed.
    - assets/icons/
    - assets/illustrations/passengers/
    - assets/illustrations/characters/
    - assets/illustrations/vehicles/
    - assets/illustrations/screens/
    # The scenes' panel drawings (specs/012-m07-onboarding/contracts/scenes.md).
    - assets/illustrations/panels/
    # The apartment's pieces and goals (specs/015-m10-apartment-story,
    # research R17), synced from docs/design by tool/design/sync_assets.dart.
    # `rooms/` is declared when R17's room drawings land; the fallbacks draw
    # every room meanwhile.
    - assets/illustrations/apartment/
    - assets/illustrations/apartment/pieces/
    - assets/illustrations/apartment/goals/
    - path: assets/config/tunables.dev.json
      flavors:
        - dev
    # The bundled content pack (specs/006-m04-content-loader/contracts/bundling.md):
    # the sample in dev, the newest promoted pack in staging and prod.
    - path: assets/content/dev/
      flavors:
        - dev
    - path: assets/content/release/
      flavors:
        - staging
        - prod

  fonts:
    # The «كرتون ناعم» families (specs/008.5-m21-design-refresh, research R3).
    - family: Marhey
      fonts:
        - asset: assets/fonts/Marhey-VariableFont_wght.ttf
    - family: ReadexPro
      fonts:
        - asset: assets/fonts/ReadexPro-VariableFont_HEXP_wght.ttf
