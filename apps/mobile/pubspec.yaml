name: wassal
description: "وصّل الأجرة: a Cairo microbus fare-and-change puzzle game."
publish_to: 'none'
version: 1.0.0+2

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.7"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  connectivity_plus: ^7.3.2
  content_models:
    path: ../../packages/content_models
  crypto: ^3.0.7
  dio: ^5.11.1
  # The app database (specs/007-m05-local-economy, research R1). SQLite comes
  # from sqlite3's build hook, not from sqlite3_flutter_libs.
  drift: ^2.35.2
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.0
  intl: ^0.20.3
  material_ui: ^1.7.0
  package_info_plus: ^10.2.2
  path_provider: ^2.1.6
  riverpod_annotation: ^4.0.7
  shared_preferences: ^2.5.6
  sqlite3: ^3.7.1
  trip_engine:
    path: ../../packages/trip_engine
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: any
  drift_dev: ^2.35.1
  fake_async: ^1.3.3
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.8
  integration_test:
    sdk: flutter
  riverpod_generator: ^4.0.9
  shared_preferences_platform_interface: ^2.4.2

flutter:
  generate: true
  uses-material-design: true

  # Tunable defaults (contracts/tunables.md). The dev overrides file is
  # bundled only in the dev variant (research R12).
  assets:
    - assets/config/tunables.json
    - path: assets/config/tunables.dev.json
      flavors:
        - dev
    # The bundled content pack (specs/006-m04-content-loader/contracts/bundling.md):
    # the sample in dev, the newest promoted pack in staging and prod.
    - path: assets/content/dev/
      flavors:
        - dev
    - path: assets/content/release/
      flavors:
        - staging
        - prod

  fonts:
    - family: Lalezar
      fonts:
        - asset: assets/fonts/Lalezar-Regular.ttf
    - family: BalooBhaijaan2
      fonts:
        - asset: assets/fonts/BalooBhaijaan2-VariableFont_wght.ttf
