name: wassal
description: "وصّل الأجرة: a Cairo microbus fare-and-change puzzle game."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.7"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.0
  intl: ^0.20.3
  material_ui: ^1.7.0
  riverpod_annotation: ^4.0.7
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: any
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.8
  riverpod_generator: ^4.0.9
  shared_preferences_platform_interface: ^2.4.2

flutter:
  generate: true
  uses-material-design: true

  # Tunable defaults (contracts/tunables.md). The dev overrides file is
  # bundled only in the dev variant (research R12).
  assets:
    - assets/config/tunables.json
    - path: assets/config/tunables.dev.json
      flavors:
        - dev

  fonts:
    - family: Lalezar
      fonts:
        - asset: assets/fonts/Lalezar-Regular.ttf
    - family: BalooBhaijaan2
      fonts:
        - asset: assets/fonts/BalooBhaijaan2-VariableFont_wght.ttf
