# Installed by provision.sh --finalize: SSH only over WireGuard, keys only (research R13).
# On Ubuntu 24.04 ssh is socket-activated; the socket generator turns ListenAddress into the
# socket's address.
ListenAddress 10.66.0.1
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
AllowUsers ubuntu deploy
