# Installed by provision.sh --finalize, with the host's WireGuard address (host.env's WG_ADDRESS)
# filled in: SSH only over WireGuard, keys only (research R13). On Ubuntu 24.04 ssh is
# socket-activated; the socket generator turns ListenAddress into the socket's address.
ListenAddress @WG_ADDRESS@
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
AllowUsers ubuntu deploy
