[project]
name = "wassal-backend"
version = "0.1.0"
description = "Backend for wassal (B01 skeleton): Django API, admin and Celery workers"
requires-python = "==3.13.*"
dependencies = [
    "Django==5.2.18",
    "djangorestframework==3.18.3",
    "drf-spectacular==0.30.0",
    "celery==5.6.3",
    "django-celery-beat==2.9.0",
    "redis==6.4.0",
    "psycopg[binary]==3.3.6",
    "django-environ==0.14.0",
    "uuid-utils==1.0.0",
    "django-otp==1.7.5",
    "django-axes==8.3.1",
    "sentry-sdk==2.72.0",
    "python-json-logger==4.2.0",
    "gunicorn==26.2.0",
    "whitenoise==6.12.0",
    "requests==2.34.2",
    "boto3==1.43.114",
    "djangorestframework-simplejwt==5.5.1",
    "PyJWT[crypto]==2.15.1",
    "wassal-content",
    "wassal-solver",
]

[dependency-groups]
dev = [
    "ruff==0.17.1",
    "mypy==1.19.1",
    "django-stubs==5.2.9",
    "djangorestframework-stubs==3.16.9",
    "celery-types==0.26.0",
    "types-requests==2.33.0.20261006",
    "pytest==9.1.1",
    "pytest-django==4.14.0",
    "pytest-cov==7.1.0",
    "pytest-xdist==3.8.0",
    "factory-boy==3.3.3",
    "moto[s3]==5.2.4",
    "hypothesis==6.170.1",
    "schemathesis==4.31.1",
    "time-machine==3.5.1",
]

[tool.uv]
package = false

# The content toolkit and the solver live in the repository (B04 research R13, B05 research R1).
# They install non-editable, so the image carries them in /opt/venv; after changing tools/content_kit
# or tools/solver, run `uv sync --reinstall-package wassal-content --reinstall-package wassal-solver`
# here.
[tool.uv.sources]
wassal-content = { path = "../tools/content_kit" }
wassal-solver = { path = "../tools/solver" }

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["staticfiles"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "DJ", "BLE", "SIM", "PT", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Tests assert, use fake credentials, and define throwaway models that need no __str__.
"**/tests/**" = ["S101", "S105", "S106", "DJ008"]
"**/migrations/**" = ["E501", "I001", "RUF012"]  # generated by makemigrations
"conftest.py" = ["S101"]

[tool.mypy]
strict = true
# Module names start at backend/, whatever sits in the directories above it.
explicit_package_bases = true
mypy_path = "$MYPY_CONFIG_FILE_DIR"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
exclude = ["^\\.venv/", "^staticfiles/"]

[[tool.mypy.overrides]]
module = [
    "environ",
    "environ.*",
    "django_celery_beat.*",
    "django_otp.*",
    "axes.*",
    "boto3",
    "boto3.*",
    "botocore.*",
]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "config.settings.test"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
testpaths = ["apps", "tests", "docker/host/tests"]
addopts = "--strict-markers"

[tool.coverage.run]
source = ["apps", "config", "tools"]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "config/wsgi.py",
    "config/gunicorn.conf.py",
]
