# iOS builds run on Codemagic: the dev machine is Linux (constitution, Development workflow).
#
# ios-dev-unsigned: the dev flavor in release mode, unsigned, packaged as an IPA. Without a paid
# Apple Developer account, sign and install it with a free Apple ID, which lasts 7 days:
# docs/runbooks/ios-test-build.md. No trigger: start it from Codemagic's "Start new build".
workflows:
  ios-dev-unsigned:
    name: iOS dev (unsigned IPA)
    instance_type: mac_mini_m2
    max_build_duration: 60
    working_directory: apps/mobile
    environment:
      # Must equal .fvmrc; the first script checks it.
      flutter: 3.47.7
      xcode: latest
    scripts:
      - name: Flutter matches .fvmrc
        script: |
          want=$(sed -n 's/.*"flutter": *"\([^"]*\)".*/\1/p' ../../.fvmrc)
          have=$(flutter --version --machine | sed -n 's/.*"frameworkVersion": *"\([^"]*\)".*/\1/p')
          if [ "$want" != "$have" ]; then
            echo "codemagic.yaml runs Flutter $have, .fvmrc pins $want"
            exit 1
          fi
      # The app imports packages/content_models, whose generated parts are gitignored.
      - name: content_models build
        working_directory: packages/content_models
        script: |
          dart pub get
          dart run build_runner build -d
      - name: Dependencies and code generation
        script: |
          flutter pub get
          dart run build_runner build -d
      - name: Rive's iOS library
        script: dart run rive_native:setup --verbose --platform ios
      # Release mode: a debug build on iOS starts only from Xcode or the flutter tool.
      - name: Build
        script: flutter build ios --release --flavor dev --no-codesign
      - name: Package the IPA
        script: |
          mkdir -p build/ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/ipa/Payload/
          cd build/ipa && zip -qry wassal-dev-unsigned.ipa Payload
    artifacts:
      - apps/mobile/build/ipa/*.ipa
