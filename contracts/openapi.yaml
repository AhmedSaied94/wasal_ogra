      - migrations
    ReadinessStatusEnum:
      enum:
      - ready
      type: string
      description: '* `ready` - ready'
    ReasonEnum:
      enum:
      - validation_error
      - unknown_op_type
      - op_expired
      - unknown_content_version
      - content_version_unsupported
      - dependency_rejected
      - unknown_trip
      - unknown_sku
      - unknown_variant
      - not_for_sale
      - price_mismatch
      - not_unlocked
      - already_owned
      - already_revived
      - already_doubled
      - already_granted
      - result_exists
      - insufficient_funds
      - tank_full
      - none_left
      - no_trip
      - no_trip_start
      - no_result
      - not_doublable
