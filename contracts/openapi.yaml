openapi: 3.0.3
info:
  title: wassal API
  version: '1'
paths:
  /healthz:
    get:
      operationId: healthz
      description: Answers while the process runs. Checks nothing outside it.
      summary: Liveness
      tags:
      - health
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Liveness'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Too many requests
  /readyz:
    get:
      operationId: readyz
      description: Ready when the database, the cache and the migrations all pass.
      summary: Readiness
      tags:
      - health
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Too many requests
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: A check failed
  /v1/auth/anonymous:
    post:
      operationId: auth_anonymous
      description: 'The player of this install id, with a new session: created on
        the first call, returned afterwards, linked or not. A device whose player
        is pending deletion or deleted gets a new player.'
      summary: Create or return the device's player
      parameters:
      - in: header
        name: X-Client-Version
        schema:
          type: string
          pattern: ^[0-9]+\.[0-9]+\.[0-9]+(\+[0-9A-Za-z.-]+)?$
          maxLength: 32
        description: MAJOR.MINOR.PATCH with an optional +BUILD, such as 1.4.0+57.
        required: true
      - in: header
        name: X-Platform
        schema:
          type: string
          enum:
          - android
          - ios
        required: true
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnonymousRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnonymousTokenPair'
          description: The device's player
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnonymousTokenPair'
          description: A new player
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: A field or header is invalid
        '406':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Not acceptable
        '413':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Payload too large
        '415':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Unsupported media type
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Too many accounts from this address
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: The database is down
  /v1/auth/link:
    post:
      operationId: auth_link
      description: 'Links the Google account of `id_token` to this player. If another
        active player holds it, the answer is 409 provider_in_use with both players''
        summaries; the retry names that player in `existing_player_id` with `resolve`:
        `switch_to_existing` answers that player''s token pair and moves this device
        to it, `keep_current` moves the Google account here.'
      summary: Link Google, or resolve a conflict
      parameters:
      - in: header
        name: X-Client-Version
        schema:
          type: string
          pattern: ^[0-9]+\.[0-9]+\.[0-9]+(\+[0-9A-Za-z.-]+)?$
          maxLength: 32
        description: MAJOR.MINOR.PATCH with an optional +BUILD, such as 1.4.0+57.
        required: true
      - in: header
        name: X-Platform
        schema:
          type: string
          enum:
          - android
          - ios
        required: true
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LinkRequest'
        required: true
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LinkResult'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: A field or header is invalid
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: 'token_expired or token_invalid: the access token'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: account_deleted
        '406':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Not acceptable
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConflictEnvelope'
          description: provider_in_use (with both summaries) or provider_already_linked
        '413':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Payload too large
        '415':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Unsupported media type
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: provider_token_invalid, with details.reason
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Too many requests from this player
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Google's keys can't be fetched, or the database is down
  /v1/auth/refresh:
    post:
      operationId: auth_refresh
      description: The session's current refresh token gives a new pair. Its previous
        token, spent within the retry window, gives the same refresh token again.
        Any other spent token ends the session.
      summary: Renew a session
      parameters:
      - in: header
        name: X-Client-Version
        schema:
          type: string
          pattern: ^[0-9]+\.[0-9]+\.[0-9]+(\+[0-9A-Za-z.-]+)?$
          maxLength: 32
        description: MAJOR.MINOR.PATCH with an optional +BUILD, such as 1.4.0+57.
        required: true
      - in: header
        name: X-Platform
        schema:
          type: string
          enum:
          - android
          - ios
        required: true
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: A field or header is invalid
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: token_expired, or token_invalid (which may have ended the session)
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: account_deleted
        '406':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Not acceptable
        '413':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Payload too large
        '415':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Unsupported media type
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Too many renewals of this session
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: The database is down
  /v1/content/manifest:
    get:
      operationId: content_manifest
      description: 'The content pack this app should have: the current one, or for
        an app below its minimum version the newest pack that app can read.'
      summary: Content manifest
      parameters:
      - in: header
        name: X-Client-Version
        schema:
          type: string
        description: MAJOR.MINOR.PATCH, with any +BUILD suffix ignored.
      tags:
      - content
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentManifest'
          description: ''
        '406':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Too many requests
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: The database is down
components:
  schemas:
    AnonymousRequest:
      type: object
      properties:
        install_id:
          type: string
          format: uuid
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-4[0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
        platform:
          $ref: '#/components/schemas/PlatformEnum'
        locale:
          type: string
          minLength: 1
          maxLength: 16
          pattern: ^[a-z]{2,3}(-[A-Z]{2})?$
      required:
      - install_id
      - locale
      - platform
    AnonymousTokenPair:
      type: object
      properties:
        player_id:
          type: string
          format: uuid
        access:
          type: string
        refresh:
          type: string
        access_expires_in:
          type: integer
          description: 'Seconds until `access` expires: 900.'
        providers:
          type: array
          items:
            $ref: '#/components/schemas/ProviderEnum'
        created:
          type: boolean
      required:
      - access
      - access_expires_in
      - created
      - player_id
      - providers
      - refresh
    CheckResultEnum:
      enum:
      - pass
      - fail
      type: string
      description: |-
        * `pass` - pass
        * `fail` - fail
    CodeEnum:
      enum:
      - provider_in_use
      - provider_already_linked
      type: string
      description: |-
        * `provider_in_use` - provider_in_use
        * `provider_already_linked` - provider_already_linked
    ConflictDetails:
      type: object
      description: |-
        `details` of a 409: both summaries for `provider_in_use`, the provider for
        `provider_already_linked`.
      properties:
        current:
          $ref: '#/components/schemas/ConflictSummary'
        existing:
          $ref: '#/components/schemas/ExistingConflictSummary'
        provider:
          $ref: '#/components/schemas/ProviderEnum'
    ConflictEnvelope:
      type: object
      properties:
        error:
          $ref: '#/components/schemas/ConflictError'
      required:
      - error
    ConflictError:
      type: object
      properties:
        code:
          $ref: '#/components/schemas/CodeEnum'
        message:
          type: string
        details:
          $ref: '#/components/schemas/ConflictDetails'
      required:
      - code
      - details
      - message
    ConflictSummary:
      type: object
      properties:
        driver_level:
          type: integer
        chapter_id:
          type: string
        bonat:
          type: integer
      required:
      - bonat
      - chapter_id
      - driver_level
    ContentManifest:
      type: object
      properties:
        version:
          type: integer
          minimum: 0
        packs:
          type: array
          items:
            $ref: '#/components/schemas/ContentManifestPack'
          maxItems: 5
          minItems: 0
      required:
      - packs
      - version
    ContentManifestPack:
      type: object
      properties:
        pack_id:
          type: string
          pattern: ^[a-z][a-z0-9_]{1,31}$
        version:
          type: integer
          minimum: 1
        url:
          type: string
          pattern: ^https?://
        sha256:
          type: string
          pattern: ^[0-9a-f]{64}$
        size:
          type: integer
          minimum: 1
        min_client_version:
          type: string
          pattern: ^[0-9]+\.[0-9]+\.[0-9]+$
      required:
      - min_client_version
      - pack_id
      - sha256
      - size
      - url
      - version
    Error:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties: {}
      required:
      - code
      - details
      - message
    ErrorEnvelope:
      type: object
      properties:
        error:
          $ref: '#/components/schemas/Error'
      required:
      - error
    ExistingConflictSummary:
      type: object
      properties:
        driver_level:
          type: integer
        chapter_id:
          type: string
        bonat:
          type: integer
        player_id:
          type: string
          format: uuid
      required:
      - bonat
      - chapter_id
      - driver_level
      - player_id
    LinkRequest:
      type: object
      properties:
        provider:
          $ref: '#/components/schemas/ProviderEnum'
        id_token:
          type: string
          minLength: 1
          maxLength: 4096
        resolve:
          $ref: '#/components/schemas/ResolveEnum'
        existing_player_id:
          type: string
          format: uuid
      required:
      - id_token
      - provider
    LinkResult:
      type: object
      description: |-
        A link's answer. After `switch_to_existing` it is the existing player's `TokenPair`, so the
        token fields are there too.
      properties:
        player_id:
          type: string
          format: uuid
        providers:
          type: array
          items:
            $ref: '#/components/schemas/ProviderEnum'
        access:
          type: string
          description: After switch_to_existing only.
        refresh:
          type: string
          description: After switch_to_existing only.
        access_expires_in:
          type: integer
          description: 'After switch_to_existing only: 900.'
      required:
      - player_id
      - providers
    Liveness:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/LivenessStatusEnum'
        release:
          type: string
      required:
      - release
      - status
    LivenessStatusEnum:
      enum:
      - ok
      type: string
      description: '* `ok` - ok'
    PlatformEnum:
      enum:
      - android
      - ios
      type: string
      description: |-
        * `android` - android
        * `ios` - ios
    ProviderEnum:
      enum:
      - google
      type: string
      description: '* `google` - google'
    Readiness:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/ReadinessStatusEnum'
        checks:
          $ref: '#/components/schemas/ReadinessChecks'
      required:
      - checks
      - status
    ReadinessChecks:
      type: object
      properties:
        database:
          $ref: '#/components/schemas/CheckResultEnum'
        cache:
          $ref: '#/components/schemas/CheckResultEnum'
        migrations:
          $ref: '#/components/schemas/CheckResultEnum'
      required:
      - cache
      - database
      - migrations
    ReadinessStatusEnum:
      enum:
      - ready
      type: string
      description: '* `ready` - ready'
    RefreshRequest:
      type: object
      properties:
        refresh:
          type: string
          minLength: 1
          maxLength: 4096
      required:
      - refresh
    ResolveEnum:
      enum:
      - switch_to_existing
      - keep_current
      type: string
      description: |-
        * `switch_to_existing` - switch_to_existing
        * `keep_current` - keep_current
    TokenPair:
      type: object
      properties:
        player_id:
          type: string
          format: uuid
        access:
          type: string
        refresh:
          type: string
        access_expires_in:
          type: integer
          description: 'Seconds until `access` expires: 900.'
        providers:
          type: array
          items:
            $ref: '#/components/schemas/ProviderEnum'
      required:
      - access
      - access_expires_in
      - player_id
      - providers
      - refresh
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
