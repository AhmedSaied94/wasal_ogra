openapi: 3.0.3
info:
  title: wassal API
  version: '1'
paths:
  /healthz:
    get:
      operationId: healthz
      description: Answers while the process runs. Checks nothing outside it.
      summary: Liveness
      tags:
      - health
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Liveness'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Too many requests
  /readyz:
    get:
      operationId: readyz
      description: Ready when the database, the cache and the migrations all pass.
      summary: Readiness
      tags:
      - health
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Too many requests
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: A check failed
  /v1/content/manifest:
    get:
      operationId: content_manifest
      description: 'The content pack this app should have: the current one, or for
        an app below its minimum version the newest pack that app can read.'
      summary: Content manifest
      parameters:
      - in: header
        name: X-Client-Version
        schema:
          type: string
        description: MAJOR.MINOR.PATCH, with any +BUILD suffix ignored.
      tags:
      - content
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentManifest'
          description: ''
        '406':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Too many requests
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: The database is down
components:
  schemas:
    CheckResultEnum:
      enum:
      - pass
      - fail
      type: string
      description: |-
        * `pass` - pass
        * `fail` - fail
    ContentManifest:
      type: object
      properties:
        version:
          type: integer
          minimum: 0
        packs:
          type: array
          items:
            $ref: '#/components/schemas/ContentManifestPack'
          maxItems: 5
          minItems: 0
      required:
      - packs
      - version
    ContentManifestPack:
      type: object
      properties:
        pack_id:
          type: string
          pattern: ^[a-z][a-z0-9_]{1,31}$
        version:
          type: integer
          minimum: 1
        url:
          type: string
          pattern: ^https?://
        sha256:
          type: string
          pattern: ^[0-9a-f]{64}$
        size:
          type: integer
          minimum: 1
        min_client_version:
          type: string
          pattern: ^[0-9]+\.[0-9]+\.[0-9]+$
      required:
      - min_client_version
      - pack_id
      - sha256
      - size
      - url
      - version
    Error:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties: {}
      required:
      - code
      - details
      - message
    ErrorEnvelope:
      type: object
      properties:
        error:
          $ref: '#/components/schemas/Error'
      required:
      - error
    Liveness:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/LivenessStatusEnum'
        release:
          type: string
      required:
      - release
      - status
    LivenessStatusEnum:
      enum:
      - ok
      type: string
      description: '* `ok` - ok'
    Readiness:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/ReadinessStatusEnum'
        checks:
          $ref: '#/components/schemas/ReadinessChecks'
      required:
      - checks
      - status
    ReadinessChecks:
      type: object
      properties:
        database:
          $ref: '#/components/schemas/CheckResultEnum'
        cache:
          $ref: '#/components/schemas/CheckResultEnum'
        migrations:
          $ref: '#/components/schemas/CheckResultEnum'
      required:
      - cache
      - database
      - migrations
    ReadinessStatusEnum:
      enum:
      - ready
      type: string
      description: '* `ready` - ready'
