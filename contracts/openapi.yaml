      - stars_out_of_bounds
      - earnings_out_of_bounds
      - duration_out_of_bounds
      - cap_reached
      - not_eligible
      - server_only
      type: string
      description: |-
        * `validation_error` - validation_error
        * `unknown_op_type` - unknown_op_type
        * `op_expired` - op_expired
        * `unknown_content_version` - unknown_content_version
        * `content_version_unsupported` - content_version_unsupported
        * `dependency_rejected` - dependency_rejected
        * `unknown_trip` - unknown_trip
        * `unknown_sku` - unknown_sku
        * `unknown_variant` - unknown_variant
        * `not_for_sale` - not_for_sale
        * `price_mismatch` - price_mismatch
        * `not_unlocked` - not_unlocked
        * `already_owned` - already_owned
        * `already_revived` - already_revived
        * `already_doubled` - already_doubled
        * `already_granted` - already_granted
        * `result_exists` - result_exists
        * `insufficient_funds` - insufficient_funds
        * `tank_full` - tank_full
        * `none_left` - none_left
        * `no_trip` - no_trip
        * `no_trip_start` - no_trip_start
        * `no_result` - no_result
        * `not_doublable` - not_doublable
        * `trip_mismatch` - trip_mismatch
        * `stars_out_of_bounds` - stars_out_of_bounds
        * `earnings_out_of_bounds` - earnings_out_of_bounds
