<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>حذف الحساب</title>
<!-- Exported from the Claude Design canvas «وصّل الأجرة — Design». Artboard 390x844. Do not edit; edit the canvas and re-export. -->
<link rel="stylesheet" href="./fonts.css">
<style>
body{margin:0}
a{color:#1A4B8C}a:hover{color:#123A6E}
button,input{font-family:inherit}
input:focus{outline:3px solid #C23A17;outline-offset:2px}
</style>
<style>html,body{margin:0;background:#1D1A2B}</style>
</head>
<body>
<div dir="rtl" style="width: 390px; height: 844px; box-sizing: border-box; padding: 36px 16px 28px; background: #E8F4FB; color: #1D1A2B; font-family: 'Readex Pro', system-ui, sans-serif; display: flex; flex-direction: column; gap: 14px; overflow: hidden">

<header style="height: 52px; flex: none; display: flex; align-items: center; gap: 10px">
<a href="Settings.html" aria-label="رجوع" style="width: 44px; height: 44px; flex: none; border-radius: 50%; background: #FFFFFF; box-shadow: 0 4px 0 #C7DDEA; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1D1A2B" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></a>
<h1 style="flex: 1; margin: 0; font-family: Marhey, sans-serif; font-weight: 700; font-size: 26px">حذف الحساب</h1>
<span style="font-size: 12px; font-weight: 700; background: #FFFFFF; border-radius: 999px; padding: 2px 10px">خطوة ٢ من ٢</span>
</header>

<div style="flex: none; border-radius: 24px; background: #FFFFFF; box-shadow: 0 5px 0 #C7DDEA; padding: 16px; display: flex; flex-direction: column; gap: 12px">
<span style="font-size: 15px; font-weight: 700">اللي هيتمسح ومش هيرجع:</span>
<ul style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 10px">
<li style="display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 500"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="#FFD9CC"></circle><path d="M8 8l8 8M16 8l-8 8" stroke="#C23A17" stroke-width="2.6" stroke-linecap="round"></path></svg>كل الخطوط والنجوم ودرجة الأسطى</li>
<li style="display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 500"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="#FFD9CC"></circle><path d="M8 8l8 8M16 8l-8 8" stroke="#C23A17" stroke-width="2.6" stroke-linecap="round"></path></svg>الشقة والعفش والمشاهد اللي اتفتحت</li>
<li style="display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 500"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="#FFD9CC"></circle><path d="M8 8l8 8M16 8l-8 8" stroke="#C23A17" stroke-width="2.6" stroke-linecap="round"></path></svg>الجنيهات والبونات، وأي حاجة اشتريتها</li>
</ul>
</div>

<div style="flex: none; display: flex; flex-direction: column; gap: 8px">
<label for="confirmWord" style="font-size: 14px; font-weight: 600">اكتب كلمة «امسح» عشان تأكد</label>
<input id="confirmWord" type="text" placeholder="امسح" autocomplete="off" style="height: 56px; box-sizing: border-box; border: 0; border-radius: 16px; background: #FFFFFF; box-shadow: inset 0 0 0 2px #C7DDEA; padding: 0 16px; font-size: 20px; font-weight: 600; color: #1D1A2B">
</div>

<div style="margin-top: auto; display: flex; flex-direction: column; gap: 10px">
<button type="button" disabled aria-disabled="true" style="height: 60px; border: 0; border-radius: 20px; background: #F2542D; color: #1D1A2B; font-family: Marhey, sans-serif; font-weight: 700; font-size: 22px; opacity: 0.45">امسح حسابي</button>
<a href="Settings.html" style="height: 56px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; border-radius: 18px; background: #1A4B8C; color: #FFFFFF; box-shadow: 0 5px 0 #0F2F5A; font-family: Marhey, sans-serif; font-weight: 700; font-size: 21px; text-decoration: none">لأ، رجّعني</a>
</div>
</div>
</body>
</html>
