name: content_models
description: >-
  Content models for wassal, generated from content/schemas by
  `wassal-content codegen`. Never edited by hand.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.13.0

dependencies:
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

dev_dependencies:
  build_runner: ^2.16.2
  coverage: ^1.16.0
  freezed: ^4.0.2
  json_serializable: ^6.14.1
  lints: ^6.1.0
  test: ^1.33.0
