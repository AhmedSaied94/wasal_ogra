[project]
name = "wassal-content"
version = "0.1.0"
description = "Content schemas toolkit for wassal (B04): loader, canonical form, validator, codegen"
requires-python = "==3.13.*"
dependencies = [
    "jsonschema==4.26.0",
    "referencing==0.37.0",
    "pydantic==2.13.5",
]

[project.scripts]
wassal-content = "wassal_content.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wassal_content"]

[dependency-groups]
dev = [
    "ruff==0.17.1",
    "mypy==1.19.1",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "hypothesis==6.170.1",
    "types-jsonschema==4.26.0.20261006",
]

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["src/wassal_content/models/_generated.py", "tests/fixtures/codegen/expected"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "BLE", "SIM", "PT", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Tests assert, and run git with fixed arguments. So does schema-diff.
"tests/**" = ["S101", "S603", "S607"]
"src/wassal_content/schema_diff.py" = ["S603", "S607"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
explicit_package_bases = true
exclude = ["^\\.venv/", "^tests/fixtures/codegen/expected/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.coverage.run]
source = ["wassal_content"]
omit = ["*/models/_generated.py"]
