[project]
name = "wassal-solver"
version = "0.1.0"
description = "Solver and parity for wassal (B05): the Python mirror of the trip rules, the solver, the difficulty score"
requires-python = "==3.13.*"
dependencies = [
    "wassal-content",
]

[project.scripts]
wassal-solver = "wassal_solver.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wassal_solver"]
# Package data, read through importlib.resources: the solver settings, the copy of the app's
# tunables (written by `wassal-solver sync`) and the bench corpus. Listed so the wheel ships them
# even if a selection or ignore rule changes.
artifacts = [
    "src/wassal_solver/data/*.json",
    "src/wassal_solver/data/bench/*.json",
]

[tool.uv.sources]
wassal-content = { path = "../content_kit" }

[dependency-groups]
dev = [
    "ruff==0.17.1",
    "mypy==1.19.1",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "pytest-xdist==3.8.0",
    "hypothesis==6.170.1",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "BLE", "SIM", "PT", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Tests assert, and run the command line in subprocesses with fixed arguments.
"tests/**" = ["S101", "S603"]
# The bench corpus is made with a seeded generator, which is not for security.
"scripts/**" = ["S311"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
explicit_package_bases = true
exclude = ["^\\.venv/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.coverage.run]
source = ["wassal_solver"]
